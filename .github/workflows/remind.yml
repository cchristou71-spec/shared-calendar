name: Daily Calendar Reminders

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder emails
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          npm install nodemailer --silent
          node << 'SCRIPT'
          const https = require('https');
          const nodemailer = require('nodemailer');

          const SUPA_URL = process.env.SUPA_URL;
          const SUPA_KEY = process.env.SUPA_KEY;
          const GMAIL_PASS = process.env.GMAIL_PASS;

          const RECIPIENTS = {
            cos:     { name: 'Cos',     email: 'cchristou71@gmail.com' },
            carolyn: { name: 'Carolyn', email: 'carolynmarshall@btinternet.com' }
          };

          const transporter = nodemailer.createTransport({
            service: 'gmail',
            auth: { user: 'cchristou71@gmail.com', pass: GMAIL_PASS }
          });

          function httpsGet(hostname, path, headers) {
            return new Promise((resolve, reject) => {
              const req = https.request({ hostname, path, method: 'GET', headers }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => resolve(JSON.parse(d)));
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tYear  = tomorrow.getFullYear();
            const tMonth = tomorrow.getMonth();
            const tDay   = tomorrow.getDate();
            const key    = tYear + '-' + (tMonth + 1) + '-' + tDay;

            console.log('Checking reminders for key:', key);

            const supaHost = SUPA_URL.replace('https://', '').replace(/\/.*/, '');
            const rows = await httpsGet(supaHost, '/rest/v1/calendar_events?id=eq.shared&select=data', {
              apikey: SUPA_KEY,
              Authorization: 'Bearer ' + SUPA_KEY
            });

            if (!rows || !rows[0] || !rows[0].data) {
              console.log('No data found');
              return;
            }

            const events = rows[0].data;
            const dayEvents = events[key] || [];
            console.log('Events tomorrow:', dayEvents.length);

            const toRemind = dayEvents.filter(ev => ev.reminders && ev.reminders.length > 0);
            console.log('Events with reminders:', toRemind.length);

            const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const dateStr = MONTHS[tMonth] + ' ' + tDay + ' ' + tYear;

            for (const ev of toRemind) {
              for (const recipKey of ev.reminders) {
                const recipient = RECIPIENTS[recipKey];
                if (!recipient) continue;
                const timeStr = ev.timeStart ? (ev.timeEnd ? ev.timeStart + ' - ' + ev.timeEnd : ev.timeStart) : 'All day';
                try {
                  await transporter.sendMail({
                    from: '"Our Calendar" <cchristou71@gmail.com>',
                    to: recipient.email,
                    subject: 'Reminder: ' + ev.title + ' tomorrow',
                    text: 'Hi ' + recipient.name + ',\n\nReminder that you have an event tomorrow:\n\nEvent: ' + ev.title + '\nDate: ' + dateStr + '\nTime: ' + timeStr + '\n\nOur Calendar'
                  });
                  console.log('Email sent to', recipient.name);
                } catch(e) {
                  console.error('Failed to send to', recipient.name, ':', e.message);
                }
              }
            }
            console.log('Done');
          }

          main().catch(console.error);
          SCRIPT
