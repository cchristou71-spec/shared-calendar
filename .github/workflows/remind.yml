name: Daily Calendar Reminders

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send reminder emails
        timeout-minutes: 2
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_KEY }}
          GMAIL_USER: cchristou71@gmail.com
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          npm install nodemailer --silent 2>/dev/null
          timeout 90 node << 'SCRIPT'
          const https = require('https');
          const nodemailer = require('nodemailer');

          const SUPA_URL = process.env.SUPA_URL;
          const SUPA_KEY = process.env.SUPA_KEY;
          const GMAIL_USER = process.env.GMAIL_USER;
          const GMAIL_PASS = process.env.GMAIL_PASS;

          const RECIPIENTS = {
            cos:     { name: 'Cos',     email: 'cchristou71@gmail.com' },
            carolyn: { name: 'Carolyn', email: 'carolynmarshall@btinternet.com' }
          };

          const transporter = nodemailer.createTransport({
            host: 'smtp.gmail.com',
            port: 465,
            secure: true,
            auth: { user: GMAIL_USER, pass: GMAIL_PASS },
            connectionTimeout: 10000,
            greetingTimeout: 10000,
            socketTimeout: 10000
          });

          function httpsGet(hostname, path, headers) {
            return new Promise((resolve, reject) => {
              const req = https.request({ hostname, path, method: 'GET', headers, timeout: 10000 }, res => {
                let d = '';
                res.on('data', c => d += c);
                res.on('end', () => { try { resolve(JSON.parse(d)); } catch(e) { reject(e); } });
              });
              req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const tYear  = tomorrow.getFullYear();
            const tMonth = tomorrow.getMonth();
            const tDay   = tomorrow.getDate();
            const key    = tYear + '-' + (tMonth + 1) + '-' + tDay;
            console.log('Key:', key);

            const supaHost = SUPA_URL.replace('https://', '').replace(/\/.*/, '');
            const rows = await httpsGet(supaHost, '/rest/v1/calendar_events?id=eq.shared&select=data', {
              apikey: SUPA_KEY,
              Authorization: 'Bearer ' + SUPA_KEY
            });

            if (!rows || !rows[0] || !rows[0].data) { console.log('No data'); return; }

            const dayEvents = rows[0].data[key] || [];
            const toRemind  = dayEvents.filter(ev => ev.reminders && ev.reminders.length > 0);
            console.log('Events:', dayEvents.length, 'With reminders:', toRemind.length);

            const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const dateStr = MONTHS[tMonth] + ' ' + tDay + ' ' + tYear;

            for (const ev of toRemind) {
              for (const k of ev.reminders) {
                const r = RECIPIENTS[k];
                if (!r) continue;
                const timeStr = ev.timeStart ? (ev.timeEnd ? ev.timeStart+' - '+ev.timeEnd : ev.timeStart) : 'All day';
                try {
                  await transporter.sendMail({
                    from: '"Our Calendar" <' + GMAIL_USER + '>',
                    to: r.email,
                    subject: 'Reminder: ' + ev.title + ' tomorrow',
                    text: 'Hi ' + r.name + ',\n\nReminder for tomorrow:\n\nEvent: ' + ev.title + '\nDate: ' + dateStr + '\nTime: ' + timeStr + '\n\nOur Calendar'
                  });
                  console.log('Sent to', r.name);
                } catch(e) {
                  console.error('Failed:', r.name, e.message);
                }
              }
            }
            console.log('Done');
            process.exit(0);
          }

          main().catch(e => { console.error(e.message); process.exit(1); });
          SCRIPT
